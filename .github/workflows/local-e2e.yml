name: Local E2E
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; release is not immutable
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - uses: docker/setup-docker-action@v5.5.0
        with:
          version: v29.4.0
      - run: npm install --global --ignore-scripts pnpm@11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test:e2e:local --slot 0
      - if: always()
        run: pnpm e2e:down --slot 0
